
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Site | Studio Mila Caroline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      color: #831f3a;
      text-align: center;
      padding: 30px 15px;
    }
    .painel {
      background: white;
      max-width: 450px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 25px #00000015;
    }
    h1 { color: #b85b83; }
    h2 { color: #831f3a; }
  </style>
</head>
<body>
  
<div class="painel" id="painelEdicao" style="display:none">

    <h1>💅 Studio Mila Caroline</h1>
    <p>⚙️ Gerenciar Site</p>
    <h2>Bem-vinda ao painel de edição!</h2>
    <p>Aqui você poderá gerenciar fotos, preços e informações do estúdio.</p>
    <p>Estamos preparando suas ferramentas de edição.</p>
  
<h2>📸 Gerenciar fotos dos trabalhos</h2>

<input type="file" id="fotoTrabalho" accept="image/jpeg,image/png,image/webp">
  
<button type="button" id="enviarFoto">📤 Enviar foto</button>

<p id="mensagemFoto"></p>

<h2>💰 Gerenciar preços dos serviços</h2>
<div id="gerenciarPrecos"></div>


  </div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

 
const response = await fetch("/api/config");
if (!response.ok) throw new Error("Configuração indisponível");

const config = await response.json();
const supabase = createClient(config.url, config.publishableKey);
  
const listaPrecos = document.getElementById("gerenciarPrecos");

async function carregarPrecos() {
  const { data: servicos, error: erroPrecos } = await supabase
    .from("servicos_precos")
    .select("id, nome, preco")
    .order("id");

  
if (erroPrecos) {
  listaPrecos.textContent = "Erro ao carregar os preços: " + erroPrecos.message;
  return;
}

  
listaPrecos.innerHTML = "";

for (const servico of servicos) {
  const linha = document.createElement("div");
  linha.style.marginBottom = "12px";

  
const nome = document.createElement("label");
nome.textContent = servico.nome + " — R$ ";
linha.append(nome);

  
const campoPreco = document.createElement("input");
campoPreco.type = "number";
campoPreco.min = "0";
campoPreco.step = "0.01";
campoPreco.value = servico.preco ?? "";
campoPreco.placeholder = "Sob consulta";
linha.append(campoPreco);

  
const botaoSalvar = document.createElement("button");
botaoSalvar.textContent = "💾 Salvar preço";
botaoSalvar.type = "button";

 
botaoSalvar.onclick = async () => {
  const valor = campoPreco.value.trim();
  const novoPreco = valor === "" ? null : Number(valor);

  if (valor !== "" && (!Number.isFinite(novoPreco) || novoPreco < 0)) {
    alert("Digite um preço válido.");
    return;
  }

  
botaoSalvar.disabled = true;

const { error: erroSalvar } = await supabase
  .from("servicos_precos")
  .update({ preco: novoPreco })
  .eq("id", servico.id);

  
botaoSalvar.disabled = false;

if (erroSalvar) {
  alert("Erro ao salvar preço: " + erroSalvar.message);
  return;
}

alert("✅ Preço salvo com sucesso!");

  
};

  
linha.append(botaoSalvar);
listaPrecos.append(linha);

  
  }
}

 
const { data: { user }, error } = await supabase.auth.getUser();
 
const botaoEnviarFoto = document.getElementById("enviarFoto");

botaoEnviarFoto.addEventListener("click", async () => {
 const foto = document.getElementById("fotoTrabalho").files[0];
  if (!foto) return alert("Escolha uma foto primeiro!");
  document.getElementById("mensagemFoto").textContent = "Enviando foto...";
  
const nomeFoto = crypto.randomUUID() + "." + foto.name.split(".").pop().toLowerCase();

const { error: erroEnvio } = await supabase.storage.from("fotos-trabalhos").upload(nomeFoto, foto);

document.getElementById("mensagemFoto").textContent = erroEnvio ? "Erro ao enviar: " + erroEnvio.message : "Foto enviada com sucesso!";

});  


if (error || !user) {
  window.location.replace("/admin.html");
}

if (user) {
  const { data: admin, error: adminError } = await supabase
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (adminError || !admin) {
    await supabase.auth.signOut();
    window.location.replace("/admin.html");
  }

if (!adminError && admin) document.getElementById("painelEdicao").style.display = "block";
  
if (!adminError && admin) await carregarPrecos();

}
</script>    
</body>
</html>
