
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Site | Studio Mila Caroline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      color: #831f3a;
      text-align: center;
      padding: 30px 15px;
    }
    .painel {
      background: white;
      max-width: 450px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 25px #00000015;
    }
    h1 { color: #b85b83; }
    h2 { color: #831f3a; }
  </style>
</head>
<body>
  
<div class="painel" id="painelEdicao" style="display:none">

    <h1>💅 Studio Mila Caroline</h1>
    <p>⚙️ Gerenciar Site</p>
    <h2>Bem-vinda ao painel de edição!</h2>
    <p>Aqui você poderá gerenciar fotos, preços e informações do estúdio.</p>
    <p>Estamos preparando suas ferramentas de edição.</p>
  </div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

 
const response = await fetch("/api/config");
if (!response.ok) throw new Error("Configuração indisponível");

const config = await response.json();
const supabase = createClient(config.url, config.publishableKey);
 
const { data: { user }, error } = await supabase.auth.getUser();

if (error || !user) {
  window.location.replace("/admin.html");
}

if (user) {
  const { data: admin, error: adminError } = await supabase
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (adminError || !admin) {
    await supabase.auth.signOut();
    window.location.replace("/admin.html");
  }
}

if (!adminError && admin) document.getElementById("painelEdicao").style.display = "block";


}

</script>
    
</body>
</html>
